name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: pilot
          POSTGRES_PASSWORD: pilot
          POSTGRES_DB: pilot_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U pilot -d pilot_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PILOT_TEST_DATABASE_URL: postgres://pilot:pilot@127.0.0.1:5432/pilot_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - run: npm --prefix web run build
      - run: go test -race -count=1 ./...
      - run: go vet ./...
      - run: go build -trimpath -o bin/upstream-pilot ./cmd/upstream-pilot
      - run: git diff --exit-code -- web/package-lock.json go.mod go.sum
